syntax = "proto3";
package student;

//servicios protoc --go_out=. --go-grpc_out=. student.proto
service Student{
    rpc GetStudent(StudentRequest) returns (StudentResponse);
}



//mensajes

message StudentRequest{
    string name = 1;
    int32 age = 2;
    string faculty = 3;
    Discipline discipline = 4;
}

message StudentResponse{
    bool success = 1;
}

enum Discipline{
    Natacion = 0;
    Atletismo = 1;
    Boxeo = 2;
}